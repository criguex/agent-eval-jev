*{box-sizing:border-box;margin:0;padding:0}
html,body{width:960px;height:540px;overflow:hidden;background:var(--navy)}
body{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;color:var(--white);position:relative;background-image:linear-gradient(rgba(85,223,189,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(85,223,189,.06) 1px,transparent 1px);background-size:40px 40px}
.bar{position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--mint)}
h1{position:absolute;left:28px;top:18px;font-size:24px;font-weight:700}
.sub{position:absolute;left:28px;top:50px;font-size:14px;color:var(--muted)}
.sign{position:absolute;right:28px;top:26px;font-size:12px;font-weight:600;color:var(--mint)}
svg.edges{position:absolute;left:0;top:0}
.node{position:absolute;background:var(--deep);border:1.5px solid var(--grid);border-radius:10px;padding:8px 11px;opacity:.32}
.node b{display:block;font-size:13.5px;font-weight:700;color:var(--white);white-space:nowrap}
.node span{display:block;font-size:11.5px;line-height:1.35;color:var(--muted);margin-top:3px;white-space:nowrap}
.node.on{opacity:1}
.node.on.pass{border-color:var(--mint)}.node.on.fail{border-color:var(--coral)}.node.on.warn{border-color:var(--gold)}.node.on.plain{border-color:#3a6276}
.node.hot{box-shadow:0 0 0 3px rgba(85,223,189,.25)}
.node.hot.fail{box-shadow:0 0 0 3px rgba(251,129,118,.28)}.node.hot.warn{box-shadow:0 0 0 3px rgba(255,197,110,.28)}
.sym-pass{color:var(--mint)}.sym-fail{color:var(--coral)}.sym-warn{color:var(--gold)}
.caption{position:absolute;left:28px;right:28px;top:300px;font-size:16px;font-weight:600;color:var(--white);display:flex;gap:10px;align-items:center}
.caption i{font-style:normal;font-size:12px;font-weight:700;color:var(--navy);background:var(--mint);border-radius:999px;padding:2px 9px}
.term{position:absolute;left:24px;right:24px;top:334px;bottom:22px;background:var(--deep);border:1px solid var(--grid);border-radius:12px;padding:30px 16px 10px;font:12.5px/18px Menlo,Consolas,monospace;color:var(--muted);overflow:hidden}
.term .dots{position:absolute;left:14px;top:11px;display:flex;gap:6px}.term .dots u{display:block;width:9px;height:9px;border-radius:50%;background:var(--grid)}
.term .tt{position:absolute;right:14px;top:8px;font-size:11px;color:var(--muted2)}
.term p{white-space:pre;overflow:hidden;text-overflow:clip}
.term .cmd{color:var(--white)}.term .cmd:before{content:"$ ";color:var(--mint)}
.term .pass{color:var(--mint)}.term .fail{color:var(--coral)}.term .warn{color:var(--gold)}.term .hi{color:var(--white)}
.cursor{display:inline-block;width:7px;height:13px;background:var(--mint);vertical-align:-2px}
.progress{position:absolute;left:24px;bottom:10px;height:3px;background:var(--mint);border-radius:2px}

const NS = 'http://www.w3.org/2000/svg';
const COL = { mint: '#55DFBD', fail: '#FB8176', warn: '#FFC56E', pass: '#55DFBD' };
const SYM = { pass: '✓', fail: '✗', warn: '!' };
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
document.getElementById('title').textContent = SCENE.title;
document.getElementById('subtitle').textContent = SCENE.subtitle;

const nodesEl = document.getElementById('nodes');
const nodes = SCENE.nodes.map((n) => {

  nodesEl.appendChild(el);
  return { ...n, el };
});
const svg = document.getElementById('edges');
const defs = document.createElementNS(NS, 'defs');

const edges = SCENE.edges.map((e) => {

const linesEl = document.getElementById('lines');
const cap = document.getElementById('caption');
function render(t) {
  for (const n of nodes) {
    const on = t >= n.on;

    n.el.classList.toggle('hot', on && t < n.on + 0.9);

  for (const e of edges) {
    const p = Math.max(0, Math.min(1, (t - e.on) / (e.dur || 0.6)));

    e.live.setAttribute('marker-end', p >= 1 ? `url(#a${e.kind === 'fail' ? 'f' : e.kind === 'warn' ? 'w' : 'm'})` : '');

    const moving = p > 0 && p < 1;
